<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ルームチャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--panel:#fff;--ink:#1d2a27;--sub:#5d6d68;--line:#d5ded9;--accent:#3555d6;--accent-ink:#fff;--warn:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
#app{max-width:640px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding:20px}
.view.on{display:flex}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 10px}
p.sub{color:var(--sub);margin:0 0 20px;font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.88rem;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid #9fb2ff;outline-offset:1px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg label{flex:1;margin:0;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff}
.seg input{margin-right:6px}
.seg label:has(input:checked){border-color:var(--accent);background:#e7ecff}
.row{display:flex;gap:8px}
.row input{flex:1}
.err{color:var(--warn);font-size:.88rem;min-height:1.3em;margin:8px 0 0}
.rooms{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rooms button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px}
.rooms small{color:var(--sub)}
.empty{color:var(--sub);font-size:.92rem}
.who{color:var(--sub);font-size:.88rem;margin-bottom:12px}
.who button{padding:2px 10px;font-size:.82rem;margin-left:6px}
.warn{background:#fff3cf;border:1px solid #e8cf80;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.88rem}
.bar{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bar strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:0 10px;color:var(--sub);background:#fff}
#log{flex:1;min-height:0;overflow-y:auto;padding:14px 0;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;align-self:flex-start}
.msg .meta{font-size:.76rem;color:var(--sub);margin:0 6px 2px}
.msg .body{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;text-align:right}
.msg.me .body{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;text-align:left}
#send{padding-top:10px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">

<!-- ニックネーム -->
<section id="v-nick" class="view on">
  <div style="margin:auto 0">
    <h1>ルームチャット</h1>
    <p class="sub">はじめに、チャットで使うニックネームを入力してください。</p>
    <div class="card">
      <label for="nick">ニックネーム</label>
      <input id="nick" type="text" maxlength="20" autocomplete="off">
      <p class="err" id="nick-err"></p>
      <button class="pri" id="nick-ok" style="width:100%;margin-top:6px">はじめる</button>
    </div>
  </div>
</section>

<!-- ロビー -->
<section id="v-lobby" class="view" style="overflow-y:auto">
  <div id="cfg-warn" class="warn" hidden>script内の firebaseConfig を自分のFirebaseプロジェクトの値に書き換えてください。</div>
  <div class="who"><span id="who"></span><button id="change-nick">変更</button></div>

  <div class="card">
    <h2>公開ルーム</h2>
    <ul class="rooms" id="public-list"></ul>
    <p class="empty" id="public-empty">公開ルームはまだありません。</p>
  </div>

  <div class="card">
    <h2>ルームを作る</h2>
    <label for="c-id">ルームID</label>
    <input id="c-id" type="text" maxlength="30" autocomplete="off" placeholder="例: friends-room">
    <div class="seg">
      <label><input type="radio" name="vis" value="public" checked>公開（誰でも入れる）</label>
      <label><input type="radio" name="vis" value="private">非公開（パスワード）</label>
    </div>
    <div id="c-pass-wrap" hidden>
      <label for="c-pass">パスワード</label>
      <input id="c-pass" type="password" autocomplete="new-password">
    </div>
    <p class="err" id="c-err"></p>
    <button class="pri" id="c-ok" style="width:100%">作って入る</button>
  </div>

  <div class="card">
    <h2>ルームIDで入る</h2>
    <label for="j-id">ルームID</label>
    <input id="j-id" type="text" maxlength="30" autocomplete="off">
    <div id="j-pass-wrap" hidden>
      <label for="j-pass">パスワード</label>
      <input id="j-pass" type="password" autocomplete="off">
    </div>
    <p class="err" id="j-err"></p>
    <button id="j-ok" style="width:100%">入る</button>
  </div>
</section>

<!-- チャット -->
<section id="v-chat" class="view">
  <div class="bar">
    <button id="leave">戻る</button>
    <strong id="room-title"></strong>
    <span class="tag" id="room-tag"></span>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="send" class="row">
    <input id="text" type="text" maxlength="500" autocomplete="off" placeholder="メッセージを入力">
    <button class="pri" type="submit">送信</button>
  </form>
</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, push, onValue, onChildAdded, query, limitToLast, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ▼ Firebaseコンソールの「ウェブアプリの設定」の値に書き換える
const firebaseConfig = {
  apiKey: "AIzaSyB9kdG7mtI7ejui4jSDGdtY3qxmQpH4hNA",
  authDomain: "chat-aeb41.firebaseapp.com",
  databaseURL: "https://chat-aeb41-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chat-aeb41",
  appId: "1:437329057624:web:9122b27bbf11d62f01772d"
};

const $ = id => document.getElementById(id);
const configured = !firebaseConfig.apiKey.startsWith("YOUR_");
const db = configured ? getDatabase(initializeApp(firebaseConfig)) : null;

const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
let uid = store.get("chat-uid");
if (!uid) { uid = crypto.randomUUID(); store.set("chat-uid", uid); }
let nick = store.get("chat-nick") || "";
let stopMsgs = null;

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
}
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const validId = s => /^[^.$#\[\]\/\s]{1,30}$/.test(s);

/* ニックネーム */
$("nick").value = nick;
$("nick-ok").onclick = () => {
  const v = $("nick").value.trim();
  if (!v) { $("nick-err").textContent = "ニックネームを入力してください。"; return; }
  nick = v; store.set("chat-nick", v);
  $("nick-err").textContent = "";
  toLobby();
};
$("nick").onkeydown = e => { if (e.key === "Enter") $("nick-ok").click(); };
$("change-nick").onclick = () => show("v-nick");

function toLobby() {
  $("who").textContent = "ニックネーム: " + nick;
  show("v-lobby");
}

/* 公開ルーム一覧 */
if (db) {
  onValue(ref(db, "publicRooms"), snap => {
    const list = $("public-list");
    list.textContent = "";
    const rooms = snap.val() || {};
    const ids = Object.keys(rooms).sort((a, b) => (rooms[b].createdAt || 0) - (rooms[a].createdAt || 0));
    $("public-empty").hidden = ids.length > 0;
    ids.forEach(id => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const n = document.createElement("span"); n.textContent = id;
      const s = document.createElement("small"); s.textContent = "作成: " + (rooms[id].creator || "?");
      b.append(n, s);
      b.onclick = () => enterRoom(id, true);
      li.append(b); list.append(li);
    });
  });
} else {
  $("cfg-warn").hidden = false;
}

/* ルーム作成 */
document.querySelectorAll("input[name=vis]").forEach(r => {
  r.onchange = () => { $("c-pass-wrap").hidden = document.querySelector("input[name=vis]:checked").value !== "private"; };
});
$("c-ok").onclick = async () => {
  const err = $("c-err"); err.textContent = "";
  if (!db) { err.textContent = "Firebaseの設定が未入力です。"; return; }
  const id = $("c-id").value.trim();
  const isPublic = document.querySelector("input[name=vis]:checked").value === "public";
  const pass = $("c-pass").value;
  if (!validId(id)) { err.textContent = "ルームIDは30文字以内で、空白と . $ # [ ] / は使えません。"; return; }
  if (!isPublic && !pass) { err.textContent = "非公開ルームにはパスワードが必要です。"; return; }
  try {
    if ((await get(ref(db, "roomsMeta/" + id))).exists()) { err.textContent = "そのルームIDは使われています。別のIDにしてください。"; return; }
    await set(ref(db, "roomsMeta/" + id), { public: isPublic, passHash: isPublic ? null : await sha(id + ":" + pass), createdAt: Date.now() });
    if (isPublic) await set(ref(db, "publicRooms/" + id), { creator: nick, createdAt: Date.now() });
    $("c-id").value = ""; $("c-pass").value = "";
    openChat(id, isPublic);
  } catch (e) { err.textContent = "作成できませんでした: " + e.message; }
};

/* ルームに入る */
$("j-ok").onclick = () => enterRoom($("j-id").value.trim(), false);
async function enterRoom(id, fromList) {
  const err = $("j-err"); err.textContent = "";
  if (!db) { err.textContent = "Firebaseの設定が未入力です。"; return; }
  if (!validId(id)) { err.textContent = "ルームIDを入力してください。"; return; }
  try {
    const snap = await get(ref(db, "roomsMeta/" + id));
    if (!snap.exists()) { err.textContent = "そのルームは見つかりません。"; return; }
    const meta = snap.val();
    if (!meta.public) {
      $("j-pass-wrap").hidden = false;
      const pass = $("j-pass").value;
      if (!pass) { err.textContent = "このルームは非公開です。パスワードを入力してください。"; $("j-id").value = id; return; }
      if (await sha(id + ":" + pass) !== meta.passHash) { err.textContent = "パスワードが違います。"; return; }
    }
    $("j-id").value = ""; $("j-pass").value = ""; $("j-pass-wrap").hidden = true;
    openChat(id, !!meta.public);
  } catch (e) { err.textContent = "入室できませんでした: " + e.message; }
}

/* チャット */
function openChat(id, isPublic) {
  $("room-title").textContent = id;
  $("room-tag").textContent = isPublic ? "公開" : "非公開";
  $("log").textContent = "";
  show("v-chat");
  window.currentRoom = id;
  stopMsgs = onChildAdded(query(ref(db, "messages/" + id), limitToLast(100)), snap => {
    const m = snap.val(); if (!m) return;
    const log = $("log");
    const nearEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    const wrap = document.createElement("div");
    wrap.className = "msg" + (m.uid === uid ? " me" : "");
    const meta = document.createElement("div"); meta.className = "meta";
    const t = new Date(m.ts || Date.now());
    meta.textContent = m.name + "  " + t.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    const body = document.createElement("div"); body.className = "body"; body.textContent = m.text;
    wrap.append(meta, body); log.append(wrap);
    if (nearEnd || m.uid === uid) log.scrollTop = log.scrollHeight;
  });
}
$("send").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  try { await push(ref(db, "messages/" + window.currentRoom), { uid, name: nick, text, ts: serverTimestamp() }); }
  catch { $("text").value = text; }
};
$("leave").onclick = () => { if (stopMsgs) stopMsgs(); stopMsgs = null; window.currentRoom = null; toLobby(); };
</script>
</body>
</html>
